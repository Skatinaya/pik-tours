<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PIK — Корзина тура</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="tour.css"/>
  <style>
    .page-hero {
      background: linear-gradient(135deg, #0f1a14 0%, #1a2e1f 100%);
      padding: 70px 32px 50px; text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .page-hero-tag {
      display: inline-block; background: rgba(42,122,74,0.18);
      border: 1px solid rgba(42,122,74,0.4); color: #5fc48a;
      font-size: 11px; font-weight: 600; letter-spacing: 0.1em;
      text-transform: uppercase; padding: 5px 16px; border-radius: 20px; margin-bottom: 18px;
    }
    .page-hero h1 {
      font-family: 'Unbounded', sans-serif;
      font-size: clamp(26px, 4vw, 44px); font-weight: 700; color: #fff;
      margin-bottom: 14px; line-height: 1.15;
    }
    .page-hero p { font-size: 15px; color: rgba(255,255,255,0.5); max-width: 540px; margin: 0 auto; line-height: 1.7; }

    .cart-container { max-width: 900px; margin: 0 auto; padding: 32px; }

    .cart-empty {
      text-align: center; padding: 60px 20px;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
    }
    .cart-empty-icon { font-size: 48px; margin-bottom: 16px; }
    .cart-empty h2 {
      font-family: 'Unbounded', sans-serif; font-size: 20px; font-weight: 700;
      color: #fff; margin-bottom: 10px;
    }
    .cart-empty p { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 24px; }
    .btn-primary {
      background: #2A7A4A; color: #fff; border: none;
      padding: 12px 28px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-block; transition: background 0.15s;
    }
    .btn-primary:hover { background: #1f5e38; }
    .btn-outline {
      background: transparent; color: rgba(255,255,255,0.7);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 28px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-block; transition: all 0.15s;
    }
    .btn-outline:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
    .btn-danger {
      background: rgba(220,80,80,0.15); color: #ff6060; border: 1px solid rgba(220,80,80,0.3);
      padding: 8px 18px; border-radius: 8px;
      font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-danger:hover { background: rgba(220,80,80,0.25); }

    .cart-item {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .cart-item.conflict { border-color: rgba(220,80,80,0.5); }
    .cart-item-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
    }
    .cart-item-emoji { font-size: 32px; }
    .cart-item-info { flex: 1; }
    .cart-item-name {
      font-family: 'Unbounded', sans-serif; font-size: 14px;
      font-weight: 700; color: #fff; margin-bottom: 3px;
    }
    .cart-item-vendor { font-size: 11px; color: rgba(255,255,255,0.4); }
    .cart-item-price {
      font-family: 'Unbounded', sans-serif; font-size: 16px;
      font-weight: 700; color: #fff;
    }
    .cart-item-price span { font-size: 10px; color: rgba(255,255,255,0.35); font-family: 'Inter', sans-serif; font-weight: 400; }
    .cart-item-remove {
      background: none; border: none; color: rgba(255,255,255,0.3);
      font-size: 18px; cursor: pointer; padding: 4px 8px; transition: color 0.15s;
    }
    .cart-item-remove:hover { color: #ff6060; }

    .cart-item-controls {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;
    }
    .cart-field label {
      display: block; font-size: 10px; font-weight: 600;
      color: rgba(255,255,255,0.45); letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 5px;
    }
    .cart-field select, .cart-field input {
      width: 100%; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      padding: 8px 12px; color: #fff; font-size: 13px;
      font-family: 'Inter', sans-serif; outline: none; box-sizing: border-box;
    }
    .cart-field select option { background: #1a2e1f; }
    .cart-field input:focus, .cart-field select:focus { border-color: rgba(42,122,74,0.6); }

    .conflict-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(220,80,80,0.15); color: #ff6060;
      font-size: 11px; font-weight: 600; padding: 4px 10px;
      border-radius: 6px; margin-top: 10px;
    }

    .cart-summary {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 28px; margin-top: 24px;
    }
    .cart-summary-title {
      font-family: 'Unbounded', sans-serif; font-size: 16px;
      font-weight: 700; color: #fff; margin-bottom: 16px;
    }
    .summary-line {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px; color: rgba(255,255,255,0.6);
    }
    .summary-line:last-of-type { border-bottom: none; }
    .summary-total {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0 0; margin-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }
    .summary-total-label {
      font-family: 'Unbounded', sans-serif; font-size: 14px;
      font-weight: 700; color: #fff;
    }
    .summary-total-price {
      font-family: 'Unbounded', sans-serif; font-size: 22px;
      font-weight: 700; color: #2A7A4A;
    }
    .cart-actions {
      display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
    }

    @media (max-width: 600px) {
      .cart-item-controls { grid-template-columns: 1fr; }
      .cart-container { padding: 16px; }
    }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="index.html">
    <svg viewBox="0 0 28 28" fill="none"><polygon points="14,2 27,26 1,26" fill="#2A7A4A"/><polygon points="14,9 21,23 7,23" fill="rgba(255,255,255,0.15)"/></svg>
    <span class="logo-text">PIK</span>
  </a>
  <div style="display:flex;gap:8px;align-items:center;">
    <a href="catalog.html" style="color:#5fc48a;font-size:13px;font-weight:600;text-decoration:none;">Каталог</a>
    <a href="tour-builder.html" style="color:#5fc48a;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">Собрать тур</a>
    <a href="gear-shop.html" style="color:#f0a500;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">🎒 Снаряжение</a>
    <a href="group-tours.html" style="color:#5fc48a;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">👥 Группы</a>
    <a href="photo-safari.html" style="color:#f0a500;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">📸 Фото</a>
    <a href="property-mgmt.html" style="color:#5fc48a;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">🏠 Жильё</a>
    <a href="cart.html" id="cartNavBtn" style="color:#f0a500;font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;position:relative;">🛒 <span id="cartCount" style="background:#2A7A4A;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:2px;">0</span></a>
    <a href="profile.html" style="color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;text-decoration:none;padding:8px 14px;white-space:nowrap;">👤 Профиль</a>
    <a href="partner.html" style="background:#2A7A4A;color:#fff;padding:8px 18px;font-size:12px;border-radius:8px;font-weight:600;text-decoration:none;">+ Добавить услугу</a>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-tag">Конструктор тура</div>
  <h1>Корзина тура</h1>
  <p>Настройте даты, время и количество участников для каждой услуги. Проверьте конфликты и сформируйте маршрут.</p>
</div>

<div class="cart-container">
  <div id="cartContent"></div>
</div>

<!-- TOAST -->
<div id="toast" style="
  position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#2A7A4A; color:#fff; padding:12px 24px; border-radius:30px;
  font-size:13px; font-weight:600; opacity:0; transition:all 0.3s; z-index:999;
  white-space:nowrap; pointer-events:none;">
</div>

<script>
function getCart() {
  try { return JSON.parse(localStorage.getItem('pik_cart')) || []; }
  catch { return []; }
}
function saveCart(cart) {
  localStorage.setItem('pik_cart', JSON.stringify(cart));
  updateCartCount();
}
function updateCartCount() {
  const el = document.getElementById('cartCount');
  if (el) el.textContent = getCart().length;
}

function removeFromCart(id) {
  let cart = getCart();
  cart = cart.filter(c => c.id !== id);
  saveCart(cart);
  renderCart();
}

function clearCart() {
  localStorage.removeItem('pik_cart');
  updateCartCount();
  renderCart();
}

function getCartSettings() {
  try { return JSON.parse(localStorage.getItem('pik_cart_settings')) || {}; }
  catch { return {}; }
}
function saveCartSettings(settings) {
  localStorage.setItem('pik_cart_settings', JSON.stringify(settings));
}

function onSettingChange(id, field, value) {
  const settings = getCartSettings();
  if (!settings[id]) settings[id] = {};
  settings[id][field] = value;
  saveCartSettings(settings);
  checkConflicts();
  updateSummary();
}

function checkConflicts() {
  const cart = getCart();
  const settings = getCartSettings();
  const conflicts = new Set();

  for (let i = 0; i < cart.length; i++) {
    const si = settings[cart[i].id] || {};
    if (!si.date || !si.timeSlot) continue;
    const startI = parseTime(si.timeSlot);
    const endI = startI + (cart[i].durH || 1) * 60;

    for (let j = i + 1; j < cart.length; j++) {
      const sj = settings[cart[j].id] || {};
      if (!sj.date || !sj.timeSlot) continue;
      if (si.date !== sj.date) continue;
      const startJ = parseTime(sj.timeSlot);
      const endJ = startJ + (cart[j].durH || 1) * 60;

      if (startI < endJ && endI > startJ) {
        conflicts.add(cart[i].id);
        conflicts.add(cart[j].id);
      }
    }
  }

  document.querySelectorAll('.cart-item').forEach(el => {
    const id = parseInt(el.dataset.id);
    const badge = el.querySelector('.conflict-badge');
    if (conflicts.has(id)) {
      el.classList.add('conflict');
      if (badge) badge.style.display = 'inline-flex';
    } else {
      el.classList.remove('conflict');
      if (badge) badge.style.display = 'none';
    }
  });
}

function parseTime(str) {
  const [h, m] = str.split(':').map(Number);
  return h * 60 + (m || 0);
}

function updateSummary() {
  const cart = getCart();
  const settings = getCartSettings();
  const summaryEl = document.getElementById('cartSummary');
  if (!summaryEl || cart.length === 0) return;

  const lines = cart.map(item => {
    const s = settings[item.id] || {};
    const persons = parseInt(s.persons) || 1;
    const itemTotal = item.price * persons;
    return `<div class="summary-line">
      <span>${item.emoji} ${item.name} ${persons > 1 ? '× ' + persons : ''}</span>
      <span style="color:#fff;font-weight:600;">${itemTotal.toLocaleString()} ₽</span>
    </div>`;
  }).join('');

  const total = cart.reduce((sum, item) => {
    const s = settings[item.id] || {};
    return sum + item.price * (parseInt(s.persons) || 1);
  }, 0);

  summaryEl.innerHTML = `
    <div class="cart-summary-title">Итого</div>
    ${lines}
    <div class="summary-total">
      <span class="summary-total-label">К оплате</span>
      <span class="summary-total-price">${total.toLocaleString()} ₽</span>
    </div>
    <div class="cart-actions">
      <button class="btn-primary" onclick="buildRoute()" style="flex:1;">Сформировать маршрут →</button>
      <button class="btn-danger" onclick="clearCart()">Очистить корзину</button>
    </div>
  `;
}

function buildRoute() {
  const cart = getCart();
  const settings = getCartSettings();
  if (cart.length === 0) return;

  // Determine zone from cart items
  const locations = [...new Set(cart.map(c => c.location).filter(Boolean))];
  const zone = locations[0] || 'ski';

  // Build tour data for tour-result
  const tourDays = {};
  cart.forEach(item => {
    const s = settings[item.id] || {};
    const date = s.date || 'День 1';
    if (!tourDays[date]) tourDays[date] = [];
    const persons = parseInt(s.persons) || 1;
    tourDays[date].push({
      time: s.timeSlot || '09:00',
      durH: item.durH || 1,
      name: item.name,
      emoji: item.emoji,
      vendor: item.vendor || '',
      price: item.price * persons,
      unit: item.unit,
      persons: persons
    });
  });

  // Sort events within each day
  Object.values(tourDays).forEach(day => day.sort((a, b) => parseTime(a.time) - parseTime(b.time)));

  const total = cart.reduce((sum, item) => {
    const s = settings[item.id] || {};
    return sum + item.price * (parseInt(s.persons) || 1);
  }, 0);

  const tourData = {
    name: 'Мой тур на PIK',
    location: zone,
    dates: Object.keys(tourDays).sort(),
    participants: Math.max(...cart.map(c => parseInt((settings[c.id] || {}).persons) || 1)),
    days: tourDays,
    total: total,
    createdAt: new Date().toISOString()
  };

  localStorage.setItem('pik_tour', JSON.stringify(tourData));

  // Save to history
  let history = [];
  try { history = JSON.parse(localStorage.getItem('pik_tours_history')) || []; } catch {}
  history.unshift(tourData);
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('pik_tours_history', JSON.stringify(history));

  window.location.href = 'tour-result.html';
}

function renderCart() {
  const cart = getCart();
  const settings = getCartSettings();
  const container = document.getElementById('cartContent');

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="cart-empty">
        <div class="cart-empty-icon">🛒</div>
        <h2>Корзина пуста</h2>
        <p>Добавьте услуги из каталога, чтобы собрать свой идеальный тур</p>
        <a href="catalog.html" class="btn-primary">Перейти в каталог →</a>
      </div>
    `;
    return;
  }

  const itemsHtml = cart.map(item => {
    const s = settings[item.id] || {};
    const slotsHtml = (item.timeSlots || ['09:00','12:00','15:00']).map(slot =>
      `<option value="${slot}" ${s.timeSlot === slot ? 'selected' : ''}>${slot}</option>`
    ).join('');

    return `
    <div class="cart-item" data-id="${item.id}">
      <div class="cart-item-header">
        <span class="cart-item-emoji">${item.emoji}</span>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-vendor">${item.vendor || ''} · ${item.durH}ч</div>
        </div>
        <div class="cart-item-price">${item.price.toLocaleString()} ₽ <span>/ ${item.unit}</span></div>
        <button class="cart-item-remove" onclick="removeFromCart(${item.id})" title="Убрать">✕</button>
      </div>
      <div class="cart-item-controls">
        <div class="cart-field">
          <label>Дата</label>
          <input type="date" value="${s.date || ''}" onchange="onSettingChange(${item.id}, 'date', this.value)"/>
        </div>
        <div class="cart-field">
          <label>Время</label>
          <select onchange="onSettingChange(${item.id}, 'timeSlot', this.value)">
            <option value="">Выберите...</option>
            ${slotsHtml}
          </select>
        </div>
        <div class="cart-field">
          <label>Человек</label>
          <input type="number" min="1" max="50" value="${s.persons || 1}" onchange="onSettingChange(${item.id}, 'persons', this.value)"/>
        </div>
      </div>
      <div class="conflict-badge" style="display:none;">⚠️ Конфликт времени</div>
    </div>`;
  }).join('');

  container.innerHTML = itemsHtml + '<div id="cartSummary" class="cart-summary"></div>';
  updateSummary();
  checkConflicts();
}

// Init
renderCart();
updateCartCount();
</script>

</body>
</html>
